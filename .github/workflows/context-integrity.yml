name: Context integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate project context
        env:
          CONTEXT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/validate-project-context.mjs
